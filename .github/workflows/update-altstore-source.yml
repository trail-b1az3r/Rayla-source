name: update-altstore-source

on:
  schedule:
    - cron: '17 * * * *'  # hourly at :17 (offset from :00 to avoid GitHub's top-of-hour scheduling load/delays)
  workflow_dispatch:
    inputs:
      reason:
        description: 'Optional note for why this run was triggered manually'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: update-altstore-source
  cancel-in-progress: true

jobs:
  update-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Update AltStore source JSON
        env:
          SOURCE_JSON_PATH: docs/public/v1/altstore-source.json
          MANUAL_RUN_REASON: ${{ github.event.inputs.reason }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_altstore_source.py

      - name: Validate JSON syntax
        run: |
          python3 -c "import json; json.load(open('docs/public/v1/altstore-source.json'))" && echo "JSON is valid"

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet -- docs/public/v1/altstore-source.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes detected - source is already up to date"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected in altstore-source.json"
          fi

      - name: Commit updated source
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/public/v1/altstore-source.json
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            git commit -m "chore: update IPA sources (manual)"
          else
            git commit -m "chore: update IPA sources (scheduled)"
          fi
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
